<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="A space for creative possibilities. Objects of light and glass, made to be turned in the hand.">

  <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="manifest" href="./manifest.webmanifest">

  <meta property="og:title" content="The Light Orb">
  <meta property="og:description" content="A space for creative possibilities. Objects of light and glass, made to be turned in the hand.">
  <meta property="og:url" content="https://carlatres3.github.io/light-orb/">
  <meta property="og:image" content="https://carlatres3.github.io/light-orb/icons/share.jpg">
  <meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">

  <meta name="twitter:card" content="summary_large_image">

  <script>if(/[?&]warm\b/.test(location.search))document.documentElement.classList.add('warm');</script>
  <style>
    :root { --night: #080808; --ink: #141414; }
    /* Monochrome intro: the eclipse, glass and light world in black and white,
       matching the site. ?warm restores the original rose-gold palette. */
    html:not(.warm) .intro { filter: grayscale(1) contrast(1.06); }
    html.warm { --night: #0a0806; --ink: #17120d; }
    html, body { margin: 0; height: 100%; background: var(--night); overflow: hidden; }
    .intro { position: fixed; inset: 0; touch-action: none; -webkit-user-select: none; user-select: none; }
    .intro-env, .intro-world { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .intro-world { z-index: 0; }
    .intro-env { z-index: 1; }
    .light-orb-master { z-index: 3; }

    /* 07 — the continue cue: one action, quiet, editorial (it waits). */
    .cue { position: absolute; z-index: 4; margin: 0; left: 50%; top: calc(43vh + min(23vh, 15vw) + 9vh); transform: translate(-50%, 6px);
      text-align: center; pointer-events: none; opacity: 0; transition: opacity .45s ease, transform .9s cubic-bezier(.2, .7, .1, 1); }
    .cue-in { opacity: 1; transform: translate(-50%, 0); transition: opacity 1.1s ease, transform 1.4s cubic-bezier(.2, .7, .1, 1); }
    /* Same voice as "slide to enter" and "Hello.": light, lowercase, natural spacing. */
    .cue-main { display: block; font: 300 14px/1.2 "Helvetica Neue", "Inter", Arial, sans-serif; letter-spacing: .01em;
      color: rgba(244, 236, 224, .6); }

    /* 14–15 — the control. The glass is one WebGL object (.intro-glass,
       intro/glass-control.js) beneath the master orb; .glass-cap is only its
       invisible hit area. */
    .intro-glass { position: absolute; z-index: 2; pointer-events: none; transition: opacity .45s ease; }
    .intro-glass.done { opacity: 0; }
    .glass-cap { position: absolute; z-index: 2; border-radius: 999px; pointer-events: auto; }
    .glass-thumb { position: absolute; z-index: 4; border-radius: 50%; cursor: grab; touch-action: none; outline: none; }
    /* The focus ring is for keyboard users only (the thumb is focused for them
       programmatically; pointer users never see a ring around the orb). */
    .keyboard .glass-thumb:focus-visible { box-shadow: 0 0 0 1px rgba(255, 228, 186, .4), 0 0 0 5px rgba(255, 228, 186, .06); }
    /* Once entered, the hit area goes too: the site styles its own .glass cards. */
    .glass-cap.glass-done, .glass-done ~ .glass-thumb { visibility: hidden; pointer-events: none; }
    .glass-dragging .glass-thumb { cursor: grabbing; }

    /* 18–20 — Hello: an invisible editorial grid over the light world. Two
       regions, never drawn: the copy (left, in the sky above the horizon) and
       the orb zone (right, standing on the horizon, partly beyond the edge).
       The ground row matches the world's horizon (HORIZON = .27 in intro.js).
       The orb's final place and range are measured from .hello-orb-zone. */
    .hello { position: absolute; inset: 0; z-index: 6; pointer-events: none; color: var(--ink);
      display: grid; grid-template-columns: [copy] minmax(0, 1fr) [orb] auto; grid-template-rows: [sky] 1fr [ground] 27vh;
      padding-left: 10.5vw; }
    .hello-copy { grid-column: copy; grid-row: sky; align-self: center; margin-bottom: 4vh; }
    /* The orb's region: a short stretch of horizon near the right edge, fully
       inside the frame. The orb rests toward its right end and may glide only
       within it. */
    .hello-orb-zone { --orb-d: clamp(64px, 6.2vw, 112px); grid-column: orb; grid-row: sky; align-self: end;
      width: calc(var(--orb-d) * 2.2); height: var(--orb-d); margin-right: calc(var(--orb-d) * .45); }
    .hello h1 { margin: 0; font: 200 clamp(88px, 10.4vw, 196px)/.92 "Helvetica Neue", "Inter", Arial, sans-serif;
      letter-spacing: -.035em; opacity: 0; transition: opacity 1s ease; }
    .hello p { margin: 2.4vw 0 0 .4vw; font: 300 clamp(16px, 1.5vw, 26px)/1.4 "Helvetica Neue", "Inter", Arial, sans-serif;
      letter-spacing: .005em; color: #3a3027; opacity: 0; transition: opacity .9s ease .2s; }
    /* The copy only fades in, in place: set text, never a moving element. */
    .hello-in h1, .hello-in p { opacity: 1; }
    /* The welcome after the intro is hosted by the Orb (dist/app/site.js);
       this copy remains only for the static, no-WebGL page. */
    body:not(.static) .hello-copy { display: none; }

    .skip { position: fixed; z-index: 7; right: 20px; bottom: 16px; background: none; border: 0; padding: 6px;
      font: 300 9px/1 "Helvetica Neue", Arial, sans-serif; letter-spacing: .32em; text-transform: uppercase;
      color: rgba(200, 182, 152, .2); cursor: pointer; transition: opacity 1s ease, color .4s ease; }
    .skip:hover, .skip:focus-visible { color: rgba(230, 210, 176, .5); outline: none; }
    .complete .skip { opacity: 0; pointer-events: none; }
    /* Sound (optional layer): appears once the visitor's Space has started
       it; the same quiet voice as Skip, in the opposite corner. */
    .sound { position: fixed; z-index: 7; left: 20px; bottom: 16px; background: none; border: 0; padding: 6px;
      font: 300 9px/1 "Helvetica Neue", Arial, sans-serif; letter-spacing: .32em; text-transform: uppercase;
      color: rgba(200, 182, 152, .2); cursor: pointer; transition: color .4s ease; }
    .sound:hover, .sound:focus-visible { color: rgba(230, 210, 176, .5); outline: none; }
    .complete .sound { color: rgba(23, 18, 13, .22); }
    .complete .sound:hover, .complete .sound:focus-visible { color: rgba(23, 18, 13, .5); }
    .sound[hidden] { display: none; }

    /* Before the intro's JavaScript arrives (slow networks): the loader's own
       dark circle and a fine ring, in place, after 1.2 s, so the page is never
       an empty black screen. Gone the moment intro.js runs. */
    .boot { position: absolute; left: 50%; top: 43%; width: clamp(240px, min(46vh, 30vw), 470px); aspect-ratio: 1;
      transform: translate(-50%, -50%); border-radius: 50%; background: rgba(4, 3, 2, .94);
      box-shadow: inset 0 0 0 1px rgba(255, 236, 204, .16); opacity: 0; pointer-events: none;
      animation: boot-in 1.2s ease 1.2s forwards, boot-breathe 2.4s ease-in-out 2.4s infinite alternate; }
    @keyframes boot-in { to { opacity: 1; } }
    @keyframes boot-breathe { from { opacity: 1; } to { opacity: .55; } }
    @media (prefers-reduced-motion: reduce) { .boot { animation: boot-in .01s linear 1.2s forwards; } }
    body[data-ready] .boot { display: none; }

    /* Without WebGL 2: the destination only, over the light world's colour. */
    .static { background: #f6f0e4; }
    .static canvas, .static .cue, .static .skip, .static .sound { display: none; }
  </style>
  <script type="module" src="./assets/intro-MKQNNGIN.js"></script>
  <script type="module" src="./assets/site-VJ2OP5UV.js"></script>
</head>
<body>
  <main class="intro" aria-label="Light Orb">
    <div class="boot" aria-hidden="true"></div>
    <canvas class="intro-world" aria-hidden="true"></canvas>
    <canvas class="intro-env" aria-hidden="true"></canvas>
    <canvas class="intro-glass" aria-hidden="true"></canvas>
    <p class="cue" aria-live="polite"><span class="cue-main">press space</span></p>
    <div class="hello" aria-live="polite">
      <section class="hello-copy" aria-hidden="true">
        <h1>Welcome.</h1>
        <p>A space for your next idea.</p>
      </section>
      <div class="hello-orb-zone" aria-hidden="true"></div>
    </div>
  </main>
  <button class="skip" type="button">Skip</button>
  <button class="sound" type="button" hidden aria-label="Sound" aria-pressed="true">Sound on</button>
</body>
</html>
